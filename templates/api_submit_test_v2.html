<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task submit test — CamAI</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 2rem; max-width: 36rem; line-height: 1.5; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; margin-top: 0.25rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    pre { background: rgba(127,127,127,0.15); padding: 1rem; overflow: auto; }
    .muted { font-size: 0.9rem; opacity: 0.8; }
  </style>
</head>
<body>
  <h1>POST /api/v1/tasks/submit</h1>
  <p class="muted">Servis va (ixtiyoriy) kalit faqat <code>metadata</code> JSON ichida. Header: <code>X-API-Key</code> yoki <code>metadata.api_key</code>.</p>
  <form id="f" enctype="multipart/form-data">
    <label>API key (ixtiyoriy agar metadata.api_key bo‘lsa) <input name="api_key_header" type="text" placeholder="X-API-Key" autocomplete="off"></label>
    <label>Image <input name="file" type="file" accept="image/*" required></label>
    <label>metadata (majburiy, JSON)
      <textarea name="metadata" rows="6" required>{
  "service": "default",
  "api_key": "your-key",
  "camera_id": "internet"
}</textarea>
    </label>
    <button type="submit">Submit</button>
  </form>
  <pre id="out"></pre>
  <p><a href="/">Home</a></p>
  <script>
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const fd = new FormData();
      const key = ev.target.api_key_header.value.trim();
      const file = ev.target.file.files[0];
      let meta = ev.target.metadata.value.trim();
      try {
        const o = JSON.parse(meta);
        meta = JSON.stringify(o);
      } catch (e) {
        document.getElementById('out').textContent = 'metadata JSON xato: ' + e;
        return;
      }
      fd.append('file', file);
      fd.append('metadata', meta);
      const out = document.getElementById('out');
      out.textContent = '…';
      try {
        const r = await fetch('/api/v1/tasks/submit', {
          method: 'POST',
          headers: key ? { 'X-API-Key': key } : {},
          body: fd,
        });
        const text = await r.text();
        out.textContent = r.status + ' ' + r.statusText + '\n' + text;
      } catch (e) {
        out.textContent = String(e);
      }
    });
  </script>
</body>
</html>
