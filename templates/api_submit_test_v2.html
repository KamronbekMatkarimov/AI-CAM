<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task submit test — CamAI</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 2rem; max-width: 36rem; line-height: 1.5; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; margin-top: 0.25rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    pre { background: rgba(127,127,127,0.15); padding: 1rem; overflow: auto; }
    .muted { font-size: 0.9rem; opacity: 0.8; }
  </style>
</head>
<body>
  <h1>POST /api/v1/tasks/submit</h1>
  <p class="muted">Uses <code>X-API-Key</code> (must match the key stored for the chosen service in <code>outputs/logs/api_keys.json</code>).</p>
  <form id="f" enctype="multipart/form-data">
    <label>Service name <input name="service" type="text" value="default" required></label>
    <label>API key <input name="api_key" type="text" placeholder="X-API-Key header" autocomplete="off"></label>
    <label>Image <input name="file" type="file" accept="image/*" required></label>
    <label>Metadata (JSON object, optional)
      <textarea name="metadata" rows="4" placeholder='{"camera_id": "internet"}'></textarea>
    </label>
    <button type="submit">Submit</button>
  </form>
  <pre id="out"></pre>
  <p><a href="/">Home</a></p>
  <script>
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const fd = new FormData();
      const service = ev.target.service.value.trim();
      const key = ev.target.api_key.value.trim();
      const file = ev.target.file.files[0];
      const meta = ev.target.metadata.value.trim();
      fd.append('service', service);
      fd.append('file', file);
      if (meta) fd.append('metadata', meta);
      const out = document.getElementById('out');
      out.textContent = '…';
      try {
        const r = await fetch('/api/v1/tasks/submit', {
          method: 'POST',
          headers: key ? { 'X-API-Key': key } : {},
          body: fd,
        });
        const text = await r.text();
        out.textContent = r.status + ' ' + r.statusText + '\n' + text;
      } catch (e) {
        out.textContent = String(e);
      }
    });
  </script>
</body>
</html>
