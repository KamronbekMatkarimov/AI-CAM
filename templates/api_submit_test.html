<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CamAI API Submit Test</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    label { display: block; margin-bottom: 12px; }
    textarea { width: 100%; max-width: 700px; }
    input[type=file] { display: block; margin-top: 8px; }
    button { padding: 10px 18px; font-size: 1rem; }
    .result { margin-top: 18px; padding: 14px; border: 1px solid #ccc; background: #f9f9f9; }
    .preview { max-width: 100%; margin-top: 12px; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>CamAI API Submit Test</h1>
  <p>Ushbu sahifa <code>POST /api/v1/tasks/submit</code> so‘rovini yuboradi.</p>

  <label>
    API key:
    <input id="apiKeyInput" type="text" value="abc123" style="width: 320px;" />
  </label>

  <label>
    Rasm fayli:
    <input id="fileInput" type="file" accept=".jpg,.jpeg,.png,.bmp" />
  </label>

  <label>
    Metadata JSON:
    <textarea id="metadataInput" rows="10">{"nvr":{"device_id":"1","device_name":"NVR nomi","status":"online","serial":"AC2075283","ip":"192.168.3.251"},"camera_name":"Bosh xona","camera_status":"online","camera_serial":"DS-2CD2443G2-I20221022AAWRK75304167","timestamp":"2026-04-08T11:30:22Z","camera_ip":"192.168.3.248","serial_number":"DS-2CD2443G2-I20221022AAWRK75304167","model":"DS-2CD2443G2-I","firmware_version":"V5.7.10 build 220830"}</textarea>
  </label>

  <button id="submitButton">Yuborish</button>

  <div id="result" class="result">Natija shu yerda ko‘rinadi.</div>
  <img id="processedPreview" class="preview" alt="Processed result" style="display:none;" />

  <script>
    const submitButton = document.getElementById('submitButton');
    const resultBox = document.getElementById('result');
    const previewImg = document.getElementById('processedPreview');
    const fileInput = document.getElementById('fileInput');
    const metadataInput = document.getElementById('metadataInput');
    const apiKeyInput = document.getElementById('apiKeyInput');

    submitButton.addEventListener('click', async () => {
      resultBox.textContent = 'Yuborilmoqda...';
      previewImg.style.display = 'none';

      if (!fileInput.files.length) {
        resultBox.textContent = 'Iltimos, rasm faylini tanlang.';
        return;
      }
      const metadata = metadataInput.value.trim();
      if (!metadata) {
        resultBox.textContent = 'Iltimos, metadata JSON kiriting.';
        return;
      }
      try {
        JSON.parse(metadata);
      } catch (err) {
        resultBox.textContent = 'Metadata JSON noto‘g‘ri: ' + err.message;
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('metadata', metadata);

      try {
        const res = await fetch('/api/v1/tasks/submit', {
          method: 'POST',
          headers: {
            'X-API-Key': apiKeyInput.value.trim()
          },
          body: formData
        });
        const json = await res.json();
        if (!res.ok) {
          resultBox.textContent = 'Xatolik: ' + (json.error || res.statusText);
          return;
        }
        resultBox.innerHTML = '<strong>Javob:</strong><br>' +
          'people_count: ' + json.people_count + '<br>' +
          'camera_id: ' + json.camera_id + '<br>' +
          'total_people_all: ' + json.total_people_all + '<br>' +
          'processed_image_url: ' + json.processed_image_url + '<br>' +
          '<pre style="margin-top:10px;">' + JSON.stringify(json.metadata, null, 2) + '</pre>';
        if (json.processed_image_url) {
          previewImg.src = json.processed_image_url + '?t=' + Date.now();
          previewImg.style.display = 'block';
        }
      } catch (err) {
        resultBox.textContent = 'So‘rov jo‘natishda xatolik: ' + err.message;
      }
    });
  </script>
</body>
</html>
